[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostleak-cli"
version = "1.0.0"
description = "Local, offline device and privacy exposure scanner for the terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gurung-dev" }]
keywords = ["privacy", "security", "termux", "cli", "offline"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
ghostleak = "ghostleak.cli:main"

[project.urls]
Homepage = "https://github.com/gurung-dev/ghostleak-cli"

[tool.setuptools]
packages = ["ghostleak", "ghostleak.probes"]
py-modules = []
